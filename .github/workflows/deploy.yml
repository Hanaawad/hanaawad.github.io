name: Deploy site to GitHub Pages

# Builds the Astro site in `site/` and publishes the static output to the
# `gh-pages` branch, which GitHub Pages serves for this repo. The custom
# domain hanaawad.com is carried by the CNAME file in the build output
# (from site/public/CNAME). No repo settings change is required — Pages is
# already configured to serve from the gh-pages branch.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build (résumé PDF + OG images + Astro)
        working-directory: site
        run: npm run build

      - name: Disable Jekyll (so _astro/ assets are served)
        run: touch site/dist/.nojekyll

      - name: Publish to gh-pages
        working-directory: site/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git checkout -q -b gh-pages
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Deploy ${GITHUB_SHA} to Pages"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
